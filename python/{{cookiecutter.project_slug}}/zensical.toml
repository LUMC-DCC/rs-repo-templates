[project]
site_name = {{ (cookiecutter.project_name or cookiecutter.project_slug) | tojson }}
site_description = {{ cookiecutter.project_short_description | tojson }}
docs_dir = "docs"
copyright = {{ ("Copyright " ~ (cookiecutter.project_name or cookiecutter.project_slug) ~ " contributors.") | tojson }}
{% if cookiecutter.urls.documentation %}
site_url = {{ cookiecutter.urls.documentation | tojson }}
{% endif %}
{% if cookiecutter.urls.repository %}
repo_url = {{ cookiecutter.urls.repository | tojson }}
repo_name = {{ cookiecutter.urls.repository.rstrip('/').rsplit('/', 1)[-1] | tojson }}
{% endif %}

[project.theme]
features = [
  # Group top-level pages as sections in the left navigation.
  "navigation.sections",
  # Add a back-to-top button on long documentation pages.
  "navigation.top",
{% if cookiecutter.urls.repository %}
  # Link each page to its source and editing view in the repository.
  "content.action.edit",
  "content.action.view",
{% endif %}
]

[project.markdown_extensions]
# Render note, warning, tip, and similar callout blocks.
admonition = {}
# Add stable links to each generated heading.
toc.permalink = true
# Support collapsible admonitions with ??? syntax.
"pymdownx.details" = {}
# Improve fenced code blocks, especially inside admonitions.
"pymdownx.superfences" = {}
{% if "developer" in cookiecutter.documentation_types.entries %}

# Generate the technical reference from public NumPy-style Python docstrings.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "numpy"
options.show_source = true
{% endif %}
