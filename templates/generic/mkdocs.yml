site_name: "{{ (project_name or project_slug) }}"
site_description: "{{ project_short_description }}"
docs_dir: docs
{% if urls.documentation %}
site_url: "{{ urls.documentation }}"
{% endif %}
{% if urls.repository %}
repo_url: "{{ urls.repository }}"
repo_name: "{{ urls.repository.rstrip('/').rsplit('/', 1)[-1] }}"
{% endif %}

theme:
  name: material
  features:
    # Group top-level pages as sections in the left navigation.
    - navigation.sections
    # Add a back-to-top button on long documentation pages.
    - navigation.top
    # Suggest matching search terms while typing.
    - search.suggest
    # Highlight matching search terms on result pages.
    - search.highlight

plugins:
  # Keep client-side search available when plugins are configured explicitly.
  - search
  # Let docs/.pages control navigation order near the content files.
  - awesome-pages

markdown_extensions:
  # Render note, warning, tip, and similar callout blocks.
  - admonition
  # Add stable links to each generated heading.
  - toc:
      permalink: true
  # Support collapsible admonitions with ??? syntax.
  - pymdownx.details
  # Improve fenced code blocks, especially inside admonitions.
  - pymdownx.superfences
