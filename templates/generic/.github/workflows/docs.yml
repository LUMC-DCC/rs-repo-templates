name: Documentation
{% set effective_documentation_builder = documentation_builder if documentation_builder and documentation_builder in template_supported_choices.documentation_builder else "plain" %}

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt
      - name: Build documentation
{% if effective_documentation_builder == "mkdocs" %}
        run: mkdocs build --strict
{% elif effective_documentation_builder == "zensical" %}
        run: zensical build --strict
{% elif effective_documentation_builder == "sphinx" %}
        run: sphinx-build -W -b html docs/source docs/build/html
{% endif %}
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && !github.event.repository.private
        uses: actions/upload-pages-artifact@v4
        with:
{% if effective_documentation_builder == "sphinx" %}
          path: docs/build/html
{% else %}
          path: site
{% endif %}

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && !github.event.repository.private
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ '{{' }} steps.deployment.outputs.page_url {{ '}}' }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
