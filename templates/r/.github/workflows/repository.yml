name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  repository:
    name: Validate repository files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
{% set effective_formatter = quality_tools.formatter if quality_tools.formatter in template_supported_choices.quality_tools.formatter else "" %}
{% set effective_linter = quality_tools.linter if quality_tools.linter in template_supported_choices.quality_tools.linter else "" %}
{% if effective_formatter or effective_linter %}      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
{% endif %}      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository checks
        run: python -m pip install pre-commit==4.6.2
      - name: Run repository checks
        run: pre-commit run --all-files
