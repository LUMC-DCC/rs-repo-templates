name: R distribution
{% set channels = namespace(values=[]) %}
{% for channel in distribution_channels.entries %}{% set _ = channels.values.append(channel | lower) %}{% endfor %}
{% set publish_github = "github releases" in channels.values or "github release" in channels.values %}

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build source package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Validate release version
        run: Rscript tools/check_release.R
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: Rscript tools/check_release.R "${GITHUB_REF_NAME}"
      - name: Build source package
        run: R CMD build .
      - name: Check source package
        run: R CMD check --no-manual --as-cran *.tar.gz
      - name: Store source package
        uses: actions/upload-artifact@v4
        with:
          name: r-source-package
          path: "*.tar.gz"
{% if publish_github %}  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: r-source-package
          path: dist
      - name: Create release and attach source package
        env:
          GH_TOKEN: ${{ '{{' }} secrets.GITHUB_TOKEN {{ '}}' }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
{% endif %}
