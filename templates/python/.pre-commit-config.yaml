repos:
  # Keep Copier update conflicts out of commits, including conflicts produced
  # outside an active Git merge operation.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args:
          - --assume-in-merge
{% set effective_formatter_tool = quality_tools.formatter if quality_tools.formatter in template_supported_choices.quality_tools.formatter else "" %}
{% set effective_linter_tool = quality_tools.linter if quality_tools.linter in template_supported_choices.quality_tools.linter else "" %}
{% set effective_type_checker = quality_tools.type_checker if quality_tools.type_checker in template_supported_choices.quality_tools.type_checker else "" %}
{% if effective_linter_tool or effective_formatter_tool or effective_type_checker %}
  - repo: local
    hooks:
{% if effective_linter_tool == "ruff" %}
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types_or:
          - python
          - pyi
{% endif %}
{% if effective_formatter_tool == "ruff" %}
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types_or:
          - python
          - pyi
{% endif %}
{% if effective_type_checker == "mypy" %}
      - id: mypy
        name: Mypy
        entry: mypy src
        language: system
        pass_filenames: false
{% endif %}
{% endif %}
