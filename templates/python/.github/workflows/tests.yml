name: Tests
{% set ci_os_runners = [] %}
{% for operating_system in operating_systems.entries %}
{% set operating_system_name = operating_system.name if operating_system.name is defined else "" %}
{% set status = operating_system.status if operating_system.status is defined else "" %}
{% set normalized_os = operating_system_name | lower %}
{% if operating_system_name and status in ["", "Officially supported"] %}
{% if ("linux" in normalized_os or "ubuntu" in normalized_os) and "ubuntu-latest" not in ci_os_runners %}
{% set _ = ci_os_runners.append("ubuntu-latest") %}
{% endif %}
{% if ("macos" in normalized_os or "mac os" in normalized_os or "darwin" in normalized_os) and "macos-latest" not in ci_os_runners %}
{% set _ = ci_os_runners.append("macos-latest") %}
{% endif %}
{% if "windows" in normalized_os and "windows-latest" not in ci_os_runners %}
{% set _ = ci_os_runners.append("windows-latest") %}
{% endif %}
{% endif %}
{% endfor %}
{% if not ci_os_runners %}
{% set _ = ci_os_runners.append("ubuntu-latest") %}
{% endif %}

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests (${{ '{{' }} matrix.os {{ '}}' }})
    runs-on: ${{ '{{' }} matrix.os {{ '}}' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
{% for runner in ci_os_runners %}          - {{ runner }}
{% endfor %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-project
      - name: Run tests
        run: @@PROJECT_RUN@@python -m pytest
