name: Documentation
{% set effective_documentation_builder = documentation_builder if documentation_builder and documentation_builder in template_supported_choices.documentation_builder else "plain" %}

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-project
      - name: Build documentation
{% if effective_documentation_builder == "mkdocs" %}
        run: @@PROJECT_RUN@@mkdocs build --strict
{% elif effective_documentation_builder == "zensical" %}
        run: @@PROJECT_RUN@@zensical build --strict
{% elif effective_documentation_builder == "sphinx" %}
        run: @@PROJECT_RUN@@sphinx-build -W -b html docs/source docs/build/html
{% endif %}
