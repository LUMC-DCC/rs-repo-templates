name: Set up Python project
description: Install the selected project manager and all generated dependency groups.
{% set effective_project_manager = project_manager if project_manager and project_manager in template_supported_choices.project_manager else "pip" %}

runs:
  using: composite
  steps:
{% if effective_project_manager != "pixi" %}
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: pyproject.toml
{% endif %}
{% if effective_project_manager == "uv" %}
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - name: Install project dependencies
      shell: bash
      run: |
        if [[ -f uv.lock ]]; then
          uv sync --locked --all-extras
        else
          uv sync --all-extras
        fi
{% elif effective_project_manager == "poetry" %}
    - name: Install Poetry
      shell: bash
      run: python -m pip install "poetry>=2,<3"
    - name: Install project dependencies
      shell: bash
      run: |
        poetry config virtualenvs.in-project true
        if [[ -f poetry.lock ]]; then
          poetry check --lock
        fi
        poetry install --all-extras
{% elif effective_project_manager == "pdm" %}
    - name: Install PDM
      shell: bash
      run: python -m pip install "pdm>=2,<3"
    - name: Install project dependencies
      shell: bash
      run: |
        if [[ -f pdm.lock ]]; then
          pdm lock --check
          pdm sync -G :all
        else
          pdm install -G :all
        fi
{% elif effective_project_manager == "hatch" %}
    - name: Install Hatch
      shell: bash
      run: python -m pip install "hatch>=1,<2"
    - name: Install project dependencies
      shell: bash
      run: |
        if [[ -f pylock.toml ]]; then
          hatch env lock default --check
        fi
        hatch env create
{% elif effective_project_manager == "pixi" %}
    - name: Set up Pixi and install project dependencies
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        manifest-path: pyproject.toml
        cache: true
{% else %}
    - name: Install project dependencies
      shell: bash
      run: @@PROJECT_SETUP_ALL@@
{% endif %}
