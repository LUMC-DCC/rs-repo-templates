name: Deploy research software template docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '_docs/**'
      - '_contracts/field_usage.json'
      - '_config/template_policies.json'
      - '_scripts/build_rsm_reference.py'
      - '_scripts/build_copier_questions.py'
      - '_scripts/build_field_usage_docs.py'
      - '_scripts/maintain_repository.py'
      - 'zensical.toml'
      - 'poetry.lock'
      - 'pyproject.toml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Install dependencies
        run: poetry install --with docs --no-root

      - name: Check derived documentation
        run: poetry run python _scripts/maintain_repository.py --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        run: poetry run zensical build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
