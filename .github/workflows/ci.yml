name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Install dependencies
        run: |
          poetry install --with docs,dev --no-root

      - name: Validate pre-commit configuration
        run: poetry run pre-commit validate-config

      - name: Check derived files
        run: poetry run python _scripts/maintain_repository.py --check

      - name: Audit field usage statuses
        run: poetry run python _scripts/audit_field_usage_status.py

      - name: Audit GitHub Action pins
        run: poetry run python _scripts/audit_action_pins.py

      - name: Check repository Python quality
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Set up R for pkgdown checks
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install pkgdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::pkgdown

      - name: Run tests
        run: poetry run pytest

      - name: Build generated project documentation
        run: poetry run python _scripts/check_generated_docs.py

      - name: Build documentation
        run: poetry run zensical build --strict
