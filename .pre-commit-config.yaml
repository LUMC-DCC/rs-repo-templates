repos:
  - repo: local
    hooks:
      - id: copier-questions
        name: Check generated Copier questions
        entry: poetry run python _scripts/build_copier_questions.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: field-usage-docs
        name: Check generated field usage documentation
        entry: poetry run python _scripts/build_field_usage_docs.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: audit-action-pins
        name: Audit GitHub Action pins
        entry: poetry run python _scripts/audit_action_pins.py
        language: system
        pass_filenames: false
