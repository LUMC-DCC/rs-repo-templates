[project]
name = "lumc-research-software-templates"
version = "0.1.0"
description = "Service-agnostic Copier templates for FAIR research software"
authors = [
    {name = "LUMC Digital Competence Center"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "packaging>=24,<27",
    "rsm-schema @ git+https://github.com/lumc-dcc/rsm-schema.git@main",
    "rs-files-templates @ git+https://github.com/LUMC-DCC/rs-files-templates.git@main",
]

[project.urls]
"Source Code" = "https://github.com/LUMC-DCC/rs-repo-templates"
Documentation = "https://lumc-dcc.github.io/rs-repo-templates"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.6.14"
mkdocs-awesome-pages-plugin = "^2.10.1"
mkdocs-material-extensions = "^1.3.1"
mkdocs-get-deps = "^0.2.0"
pyyaml = "^6.0.2"
mkdocs = "^1.6.1"
sphinx = ">=8,<9"
myst-parser = ">=5.1.0,<6"
sphinx-book-theme = ">=1,<2"
mkdocstrings = {version = ">=1.0.6,<2", extras = ["python"]}
zensical = "^0.0.57"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^9.1.1"
rs-metadata = {git = "https://github.com/LUMC-DCC/rs-metadata.git", branch = "main"}
ruff = "^0.16.4"
pydantic-settings = ">=2,<3"
copier = "^9.17.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "templates",
    "site",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
