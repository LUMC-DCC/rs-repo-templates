[project]
name = "lumc-research-software-templates"
version = "0.1.0"
description = "Service-agnostic Copier templates for FAIR research software."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14,<4.0"
keywords = ["copier", "fair", "research-software", "templates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
authors = [
    # ORCID: https://orcid.org/0000-0002-0852-4752
    { name = "Mariia Steeghs-Turchina", email = "m.a.steeghs-turchina@lumc.nl" },
]
maintainers = [
    # ORCID: https://orcid.org/0000-0002-0852-4752
    { name = "Mariia Steeghs-Turchina", email = "m.a.steeghs-turchina@lumc.nl" },
    # ORCID: https://orcid.org/0000-0002-9839-5439
    { name = "Anna Niehues", email = "a.niehues@lumc.nl" },
]
dependencies = [
    "packaging>=24,<27",
    "rsm-schema @ git+https://github.com/lumc-dcc/rsm-schema.git@main",
    "rs-files-templates @ git+https://github.com/LUMC-DCC/rs-files-templates.git@main",
]

[project.urls]
Homepage = "https://lumc-dcc.github.io/rs-repo-templates/"
Repository = "https://github.com/LUMC-DCC/rs-repo-templates"
Issues = "https://github.com/LUMC-DCC/rs-repo-templates/issues"
Documentation = "https://lumc-dcc.github.io/rs-repo-templates/"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.2,<5.0"
pytest = ">=9.1.1,<10.0"
rs-metadata = {git = "https://github.com/LUMC-DCC/rs-metadata.git", branch = "main"}
ruff = ">=0.16.4,<1.0"
pydantic-settings = ">=2,<3"
copier = ">=9.17.2,<10.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.6.14,<10.0"
mkdocs-awesome-pages-plugin = ">=2.10.1,<3.0"
mkdocs-material-extensions = ">=1.3.1,<2.0"
mkdocs-get-deps = ">=0.2.0,<0.3.0"
pyyaml = ">=6.0.2,<7.0"
mkdocs = ">=1.6.1,<2.0"
sphinx = ">=8,<9"
myst-parser = ">=4,<5"
sphinx-book-theme = ">=1,<2"
mkdocstrings = { version = ">=0.30,<1", extras = ["python"] }
zensical = ">=0.0.57,<0.0.58"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "templates",
    "site",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
