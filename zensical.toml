[project]
site_name = "Research Software Templates"
site_description = "Service-agnostic Copier templates for FAIR research software"
site_url = "https://lumc-dcc.github.io/cookiecutter-templates"
docs_dir = "_docs"
repo_url = "https://github.com/LUMC-DCC/cookiecutter-templates"
repo_name = "LUMC-DCC/cookiecutter-templates"
edit_uri = "edit/main/_docs/"
copyright = "Copyright LUMC Digital Competence Center contributors."
nav = [
  { "Home" = "index.md" },
  { "For template users" = [
    "users/index.md",
    "users/generated-projects.md",
    "users/template-updates.md",
    "users/metadata.md",
    "users/python.md",
    { "Options" = [
      "users/options/documentation-builders.md",
      "users/options/interface-types.md",
    ] },
  ] },
  { "For service integrators" = ["integrators/index.md"] },
  { "Context reference" = [
    "contract/index.md",
    "contract/rsm-fields.md",
    "contract/field-usage.md",
  ] },
  { "For template developers" = ["developers/index.md"] },
  { "Architecture" = "architecture.md" },
]

[project.theme]
features = [
  # Group top-level pages as sections in the left navigation.
  "navigation.sections",
  # Add a back-to-top button on long documentation pages.
  "navigation.top",
  # Link each page to its source and editing view in the repository.
  "content.action.edit",
  "content.action.view",
]

[project.markdown_extensions]
# Add stable links to each generated heading.
toc.permalink = true
